name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hoteloftware_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/hoteloftware_test
      DATABASE_DIRECT_URL: postgres://postgres:postgres@localhost:5432/hoteloftware_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/hoteloftware_test
      APP_DOMAIN: localhost:3000
      BETTER_AUTH_SECRET: ci-secret-with-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tenant SQL must be unqualified
        run: pnpm db:check-tenant-sql
      - run: pnpm -r typecheck
      # packages share one test database and reset it, so they run one after another
      - run: pnpm -r --workspace-concurrency=1 test
      - run: pnpm -r --filter "./apps/*" build
